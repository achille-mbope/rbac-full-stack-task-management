# Activate with SPRING_PROFILES_ACTIVE=prod (the prod group includes postgres).
app.api-docs.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
app.security.require-https=true
app.rate-limit.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=false
spring.h2.console.enabled=false
# For a TLS-terminating proxy, set SERVER_FORWARD_HEADERS_STRATEGY=native and
# SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES to a narrow regex of trusted proxy IPs.
server.tomcat.remoteip.internal-proxies=
server.tomcat.redirect-context-root=false
