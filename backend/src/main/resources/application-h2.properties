spring.datasource.url=jdbc:h2:mem:taskmanager;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Optional machine-local key; this import is confined to the H2 development profile.
spring.config.import=optional:file:./.local/application.properties

# Local development only. API_DOCS_ENABLED=false disables documentation here too.
app.api-docs.enabled=${API_DOCS_ENABLED:true}
