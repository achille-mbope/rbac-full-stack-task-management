spring.application.name=task-manager-tests
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true

# Test-only signing key; never used by the packaged application.
JWT_SECRET=dGVzdC1vbmx5LWtleS1mb3ItdGFzay1tYW5hZ2VyLTMyaXRlcw==

# Runtime documentation is public when explicitly enabled; keep disabled on deployed hosts.
app.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.api-docs.enabled=${app.api-docs.enabled:false}
springdoc.swagger-ui.enabled=${app.api-docs.enabled:false}
springdoc.api-docs.version=OPENAPI_3_1
springdoc.paths-to-match=/api/v1/**
springdoc.override-with-generic-response=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.validator-url=

# Trust no forwarding headers unless native proxy processing is explicitly configured.
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
management.endpoints.web.exposure.include=health
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
app.rate-limit.window-seconds=60
app.rate-limit.login-per-client=20
app.rate-limit.register-per-client=5
app.rate-limit.login-global=200
app.rate-limit.register-global=50
app.rate-limit.max-clients=10000
logging.pattern.level=%5p [requestId:%X{requestId:-}]

# Existing behavior tests are independent of abuse quotas; dedicated tests enable them.
app.rate-limit.enabled=false
spring.profiles.group.prod=postgres
