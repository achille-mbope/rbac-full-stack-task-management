spring.application.name=task-manager-tests
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true

# Test-only signing key; never used by the packaged application.
JWT_SECRET=dGVzdC1vbmx5LWtleS1mb3ItdGFzay1tYW5hZ2VyLTMyaXRlcw==

# Runtime documentation is public when explicitly enabled; keep disabled on deployed hosts.
app.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.api-docs.enabled=${app.api-docs.enabled:false}
springdoc.swagger-ui.enabled=${app.api-docs.enabled:false}
springdoc.api-docs.version=OPENAPI_3_1
springdoc.paths-to-match=/api/v1/**
springdoc.override-with-generic-response=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.validator-url=
