# Test overrides only; shared defaults come from src/main/resources/application.properties.
spring.application.name=task-manager-tests
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Test-only signing key; never included in the packaged application.
JWT_SECRET=dGVzdC1vbmx5LWtleS1mb3ItdGFzay1tYW5hZ2VyLTMyaXRlcw==

# Behavior tests do not consume abuse quotas. Operational tests enable them explicitly;
# activate prod after test so production's mandatory limit setting takes precedence.
app.rate-limit.enabled=false
